<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock display demo</title><style>html,body{height:100%;margin:0;background:#193628;color:white;font:16px system-ui;display:grid;place-items:center}.demo{display:grid;gap:18px;text-align:center}.display{position:relative;width:420px;max-width:90vw;aspect-ratio:266/118;background:url("digital-display-empty.png") center/100% 100% no-repeat}.numbers{position:absolute;inset:22% 11% 24% 15%}input{font:inherit;padding:8px;background:#fff}</style><div class="demo"><h2>Seven-segment display preview</h2><div class="display"><div id="display" class="numbers"></div></div><label>Time <input id="time" type="time" value="04:00" step="300"></label></div><script>/** Dynamic seven-segment readout; no CDN or webfonts needed. */
function createSevenSegmentClock(container, initialTime = '4:00') {
  const NS = 'http://www.w3.org/2000/svg';
  const segments = {
    a: '7,2 27,2 23,6 11,6',
    b: '28,3 32,7 32,24 28,28 25,24 25,9',
    c: '28,32 32,36 32,53 28,57 25,51 25,36',
    d: '7,58 27,58 23,54 11,54',
    e: '4,32 7,36 7,51 4,57 0,53 0,36',
    f: '4,3 7,9 7,24 4,28 0,24 0,7',
    g: '7,30 11,27 23,27 27,30 23,33 11,33'
  };
  const digits = {
    '0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc',
    '5':'afgcd','6':'afgecd','7':'abc','8':'abcdefg','9':'abfgcd'
  };
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 196 64');
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label', initialTime);
  svg.style.cssText='display:block;width:100%;height:100%;overflow:visible';
  const groups=[];
  for (let i=0;i<4;i++) {
    const g=document.createElementNS(NS,'g');
    const x = (i===0 ? 4 : i===1 ? 53 : i===2 ? 110 : 155);
    g.setAttribute('transform',`translate(${x},2)`);
    for (const [seg,points] of Object.entries(segments)) {
      const p=document.createElementNS(NS,'polygon');
      p.setAttribute('points',points);
      p.dataset.segment=seg;
      p.style.transition='opacity .12s linear';
      g.appendChild(p);
    }
    svg.appendChild(g);groups.push(g);
  }
  const colon = document.createElementNS(NS,'g');
  colon.setAttribute('fill','#cf1b00');
  for (const y of [20,43]) {const dot=document.createElementNS(NS,'rect');dot.setAttribute('x','98');dot.setAttribute('y',String(y));dot.setAttribute('width','8');dot.setAttribute('height','8');dot.setAttribute('rx','1');colon.appendChild(dot);}
  svg.appendChild(colon);
  container.replaceChildren(svg);
  function setTime(time) {
    const [hr,mn] = String(time).split(':');
    const padded=hr.padStart(2,' ')+mn.padStart(2,'0');
    [...padded].forEach((c,i)=>{
      [...groups[i].children].forEach(p=>{
        p.setAttribute('fill','#c71900');
        p.setAttribute('opacity',digits[c]?.includes(p.dataset.segment)?'1':'0');
      });
    });
    svg.setAttribute('aria-label',time);
  }
  setTime(initialTime);
  return {element:svg,setTime};
}

const d=createSevenSegmentClock(document.getElementById('display'),'4:00');document.getElementById('time').addEventListener('input',e=>{const [h,m]=e.target.value.split(':');d.setTime(`${Number(h)%12||12}:${m}`)});</script></html>
